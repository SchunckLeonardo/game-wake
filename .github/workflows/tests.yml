name: Tests and static validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lambda/requirements.txt
            lambda/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r lambda/requirements.txt -r lambda/requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Python lint and format check
        run: |
          python -m ruff check lambda server
          python -m ruff format --check lambda server

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax and ShellCheck
        run: |
          bash -n scripts/*.sh server/*.sh terraform/user-data.sh.tpl
          shellcheck scripts/*.sh server/*.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Package Lambda
        run: ./scripts/package-lambda.sh

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform initialize without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate
