name: Security issue sync

on:
  workflow_run:
    workflows: ["Security checks", "CodeQL"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: security-issues-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize security issues
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted automation from main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download normalized findings only
        id: download
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: security-findings
          path: downloaded-findings
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create, update, or reopen deduplicated issues
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: >-
          python3 scripts/security/sync_github_issues.py
          --report downloaded-findings/security-findings.json
          --repository "$GITHUB_REPOSITORY"
          --run-url "$SOURCE_RUN_URL"
          --event-name "$SOURCE_EVENT"
          --head-sha "$SOURCE_HEAD_SHA"

      - name: Explain missing report
        if: steps.download.outcome != 'success'
        run: echo "The source workflow did not publish normalized security findings."
