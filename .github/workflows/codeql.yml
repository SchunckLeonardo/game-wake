name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions,python,javascript-typescript
          queries: security-extended

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: reports/codeql
          upload: true

      - name: Normalize actionable CodeQL findings
        if: always()
        run: >-
          python3 scripts/security/collect_findings.py codeql
          --sarif-glob 'reports/codeql/**/*.sarif'
          --output reports/security-findings.json

      - name: Upload normalized findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: reports/security-findings.json
          if-no-files-found: error
          retention-days: 30

      - name: Block high or critical CodeQL findings
        run: >-
          python3 scripts/security/collect_findings.py assert
          --report reports/security-findings.json
