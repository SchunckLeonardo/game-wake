[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["lambda/tests", "server/tests"]
pythonpath = ["lambda", "server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
