[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests", "lambda/tests", "server/tests", "scripts/tests"]
pythonpath = [".", "lambda", "server", "scripts", "shared"]
markers = ["integration: requires an external service such as PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
